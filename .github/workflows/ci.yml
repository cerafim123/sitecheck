name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && xargs -a build-deps.txt sudo apt-get install -y
      - run: cmake -S . -B build -DCMAKE_C_FLAGS=-Werror -DBUILD_TESTING=OFF
      - run: cmake --build build
      - run: |
          cppcheck --enable=warning,style,performance \
            --suppress=constParameterCallback:src/main.c \
            --suppress=constParameterCallback:src/server.c \
            --error-exitcode=1 -q src

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && xargs -a build-deps.txt sudo apt-get install -y
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -fsanitize=address,undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage -fsanitize=address,undefined"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --output-junit build/junit.xml
      - run: gcovr --root . --filter src/core --fail-under-line 70 build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/junit.xml

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && xargs -a build-deps.txt sudo apt-get install -y
      - run: ./build_deb.sh
      - run: lintian --fail-on error dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  deploy:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Check version and set image tags
        run: |
          VERSION="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/sitecheck" >> "$GITHUB_ENV"
      - name: Build image
        run: |
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:$SHORT_SHA" .
      - name: Smoke test before publishing
        run: |
          docker run -d --name sitecheck-smoke \
            -p 18080:8080 -e APP_PORT=8080 -e APP_API_TOKEN=ci \
            "$IMAGE:$VERSION"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS -X POST -H "X-Api-Token: ci" \
            --data-binary 'http://127.0.0.1:8080/health' \
            http://127.0.0.1:18080/api/check | grep -q '"ok":true'
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f sitecheck-smoke || true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image tags
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$SHORT_SHA"

  release:
    needs: [package, deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - run: gh release create "${{ github.ref_name }}" dist/*.deb --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
