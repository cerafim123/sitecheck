name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && xargs -a build-deps.txt sudo apt-get install -y
      - run: cmake -S . -B build -DCMAKE_C_FLAGS=-Werror -DBUILD_TESTING=OFF
      - run: cmake --build build
      - run: |
          cppcheck --enable=warning,style,performance \
            --suppressions-list=cppcheck-suppressions.txt \
            --error-exitcode=1 -q src

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && xargs -a build-deps.txt sudo apt-get install -y
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -fsanitize=address,undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage -fsanitize=address,undefined"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --output-junit junit.xml
      - run: gcovr --root . --filter src/core --fail-under-line 70 build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/junit.xml

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && xargs -a build-deps.txt sudo apt-get install -y
      - run: ./build_deb.sh
      - run: lintian --fail-on error dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  deploy:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          VERSION=$(cat VERSION)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/sitecheck"
          VERSION="${{ steps.ver.outputs.version }}"
          SHORT_SHA="${{ steps.ver.outputs.short_sha }}"
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:$SHORT_SHA" .
      - name: Push image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/sitecheck"
          VERSION="${{ steps.ver.outputs.version }}"
          SHORT_SHA="${{ steps.ver.outputs.short_sha }}"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$SHORT_SHA"

  release:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - run: gh release create "${{ github.ref_name }}" dist/*.deb --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
